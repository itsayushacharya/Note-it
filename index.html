<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note It | Professional Nepali Note App</title>
    <!-- Tailwind CSS for modern utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        google: {
                            blue: '#4285f4',
                            yellow: '#fbbc04',
                            green: '#34a853',
                            red: '#ea4335'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/ayushacharya05/Note-it/refs/heads/main/images/icon.webp">
    
    <style>
        :root {
            --note-font-size: 16px;
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .note-content-text {
            font-size: var(--note-font-size);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.8);
        }
        /* Splash screen fade out transition */
        #splash {
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        /* Drawer transition */
        .drawer-transition {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Note card hover elevation */
        .note-card {
            transition: box-shadow 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
        }
        .note-card:hover {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
        }
        .dark .note-card:hover {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-[#1e1f22] dark:text-gray-100 min-h-screen flex flex-col transition-colors duration-200 overflow-x-hidden">

    <!-- Splash Screen -->
    <div id="splash" class="fixed inset-0 bg-white dark:bg-[#1e1f22] flex flex-col justify-center items-center z-[9999]">
        <img src="https://raw.githubusercontent.com/ayushacharya05/Note-it/refs/heads/main/images/icon.webp" alt="Note It Logo" class="w-24 h-24 rounded-3xl shadow-xl mb-4 animate-bounce">
        <h2 class="font-semibold text-2xl tracking-tight text-blue-600 dark:text-blue-400">Note It</h2>
        <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">Your Professional Nepali Workspace</p>
    </div>

    <!-- Side Drawer / Navigation Menu -->
    <aside id="sideDrawer" class="drawer-transition fixed top-0 left-0 w-72 h-full bg-white dark:bg-[#2b2d31] shadow-2xl z-[3000] -translate-x-full flex flex-col pt-4 border-r border-gray-200 dark:border-gray-800">
        <div class="px-6 py-4 flex items-center space-x-3 border-b border-gray-100 dark:border-gray-700/50">
            <img src="https://raw.githubusercontent.com/ayushacharya05/Note-it/refs/heads/main/images/icon.webp" alt="Logo" class="w-8 h-8 rounded-xl shadow">
            <span class="font-bold text-lg tracking-wide text-gray-800 dark:text-gray-100">Note It Pro</span>
        </div>
        
        <div class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <div onclick="switchView('all', this)" class="drawer-item active flex items-center px-4 py-3 rounded-r-full font-medium cursor-pointer transition text-gray-700 dark:text-gray-200 hover:bg-amber-50 dark:hover:bg-gray-700/50 bg-amber-100/80 dark:bg-amber-900/30 text-amber-900 dark:text-amber-200" data-view="all">
                <i class="fa-solid fa-pen-nib w-8 text-center text-lg mr-3 text-blue-500"></i> Notes
            </div>
            <div onclick="switchView('Personal', this)" class="drawer-item flex items-center px-4 py-3 rounded-r-full font-medium cursor-pointer transition text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700/50" data-view="Personal">
                <i class="fa-solid fa-tag w-8 text-center text-lg mr-3 text-blue-500"></i> Personal
            </div>
            <div onclick="switchView('Work', this)" class="drawer-item flex items-center px-4 py-3 rounded-r-full font-medium cursor-pointer transition text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700/50" data-view="Work">
                <i class="fa-solid fa-briefcase w-8 text-center text-lg mr-3 text-emerald-500"></i> Work
            </div>
            <div onclick="switchView('Ideas', this)" class="drawer-item flex items-center px-4 py-3 rounded-r-full font-medium cursor-pointer transition text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700/50" data-view="Ideas">
                <i class="fa-solid fa-bolt w-8 text-center text-lg mr-3 text-yellow-500"></i> Ideas
            </div>
            
            <hr class="my-3 border-gray-200 dark:border-gray-700">
            
            <div onclick="switchView('trash', this)" class="drawer-item flex items-center px-4 py-3 rounded-r-full font-medium cursor-pointer transition text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700/50" data-view="trash">
                <i class="fa-regular fa-trash-can w-8 text-center text-lg mr-3 text-red-500"></i> Trash
            </div>
            <div onclick="openSettings()" class="flex items-center px-4 py-3 rounded-r-full font-medium cursor-pointer transition text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700/50">
                <i class="fa-solid fa-gear w-8 text-center text-lg mr-3 text-gray-400"></i> Settings
            </div>
        </div>
        
        <div class="p-4 border-t border-gray-100 dark:border-gray-700/50 text-xs text-gray-400 dark:text-gray-500 text-center">
            Note It v3.0 • Built with Tailwind
        </div>
    </aside>

    <!-- Menu Backdrop -->
    <div id="menuBackdrop" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[2900] hidden transition-opacity opacity-0"></div>

    <!-- App Bar -->
    <header class="sticky top-0 z-50 bg-white/90 dark:bg-[#2b2d31]/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-4 py-3 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3 flex-1 min-w-0">
            <button id="menuBtn" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition text-gray-600 dark:text-gray-300 focus:outline-none">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <h1 id="viewTitle" class="text-lg font-medium text-gray-800 dark:text-gray-100 truncate">All Notes</h1>
            
            <!-- Expandable Search Bar -->
            <div id="searchContainer" class="hidden flex-1 max-w-xl mx-2 relative items-center">
                <i class="fa-solid fa-magnifying-glass absolute left-3 text-gray-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Search notes by title or content..." class="w-full bg-gray-100 dark:bg-gray-700/60 text-gray-900 dark:text-gray-100 text-sm rounded-full pl-10 pr-10 py-2 border-none outline-none focus:ring-2 focus:ring-blue-500 transition">
                <button id="closeSearchBtn" class="absolute right-3 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>

        <div class="flex items-center space-x-1 sm:space-x-2">
            <button id="searchBtn" title="Search Notes" class="p-2.5 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition text-gray-600 dark:text-gray-300">
                <i class="fa-solid fa-magnifying-glass text-lg"></i>
            </button>
            <button onclick="toggleLayout()" id="layoutToggleBtn" title="Toggle Grid/List View" class="p-2.5 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition text-gray-600 dark:text-gray-300 hidden sm:block">
                <i class="fa-solid fa-border-all text-lg"></i>
            </button>
            <button onclick="openSettings()" title="Settings" class="p-2.5 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition text-gray-600 dark:text-gray-300">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6">
        <div id="notesContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <!-- Notes will be injected here dynamically -->
        </div>
    </main>

    <!-- Floating Action Button (FAB) -->
    <button id="addBtn" class="fixed bottom-6 right-6 w-14 h-14 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl shadow-xl hover:shadow-2xl flex items-center justify-center transition-all transform hover:scale-105 active:scale-95 z-40 focus:outline-none">
        <i class="fa-solid fa-plus text-2xl"></i>
    </button>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-[#2b2d31] rounded-3xl shadow-2xl max-w-md w-full p-6 transform transition-all scale-95 opacity-0 duration-200" id="settingsModalContent">
            <div class="flex items-center justify-between pb-4 border-b border-gray-100 dark:border-gray-700/60">
                <h3 class="text-xl font-semibold text-gray-800 dark:text-gray-100 flex items-center">
                    <i class="fa-solid fa-sliders text-blue-500 mr-2"></i> Settings
                </h3>
                <button onclick="closeSettings()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-2 rounded-full">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="py-6 space-y-6">
                <!-- Dark Mode Toggle -->
                <div class="flex items-center justify-between">
                    <div>
                        <span class="font-medium text-gray-800 dark:text-gray-200">Dark Mode</span>
                        <p class="text-xs text-gray-400">Switch between light & dark themes</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="darkToggle" onchange="toggleDark()" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                </div>

                <!-- Font Size Selector -->
                <div>
                    <label class="block font-medium text-gray-800 dark:text-gray-200 mb-1">Note Font Size</label>
                    <p class="text-xs text-gray-400 mb-2">Adjust text legibility inside note cards</p>
                    <select id="sizeSelect" onchange="updateSize()" class="w-full bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-2.5 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="14px">Compact (14px)</option>
                        <option value="16px" selected>Normal (16px)</option>
                        <option value="19px">Large (19px)</option>
                        <option value="22px">Extra Large (22px)</option>
                    </select>
                </div>

                <!-- Sorting Selector -->
                <div>
                    <label class="block font-medium text-gray-800 dark:text-gray-200 mb-1">Sort Notes By</label>
                    <p class="text-xs text-gray-400 mb-2">Choose your preferred order</p>
                    <select id="sortSelect" onchange="renderNotes()" class="w-full bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-2.5 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="new">Newest First</option>
                        <option value="old">Oldest First</option>
                        <option value="az">Alphabetical (A-Z)</option>
                    </select>
                </div>
            </div>

            <div class="pt-4 border-t border-gray-100 dark:border-gray-700/60 flex justify-end">
                <button onclick="closeSettings()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl transition shadow-sm">Save & Close</button>
            </div>
        </div>
    </div>

    <!-- Note Editor Overlay -->
    <div id="editorOverlay" class="fixed inset-0 bg-white dark:bg-[#1e1f22] z-50 hidden flex flex-col transform translate-y-full transition-transform duration-300 ease-in-out">
        <header class="px-4 py-3 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between bg-white dark:bg-[#2b2d31]">
            <button onclick="closeEditor()" class="p-2.5 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition text-gray-600 dark:text-gray-300 flex items-center space-x-2">
                <i class="fa-solid fa-arrow-left text-lg"></i>
                <span class="text-sm font-medium hidden sm:inline">Back</span>
            </button>
            
            <div class="flex items-center space-x-3">
                <select id="editLabelSelect" class="bg-gray-100 dark:bg-gray-700/80 text-gray-700 dark:text-gray-200 text-sm font-medium rounded-xl px-3 py-1.5 border-none outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Personal">Personal</option>
                    <option value="Work">Work</option>
                    <option value="Ideas">Ideas</option>
                </select>
                <button onclick="saveNote()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-full shadow-md transition flex items-center space-x-1">
                    <i class="fa-solid fa-check mr-1"></i> Done
                </button>
            </div>
        </header>

        <div class="flex-1 max-w-4xl w-full mx-auto px-6 py-8 flex flex-col overflow-y-auto">
            <input type="text" id="editTitleInput" placeholder="Title" class="w-full text-2xl sm:text-3xl font-bold bg-transparent border-none outline-none text-gray-900 dark:text-gray-100 placeholder-gray-400 mb-4">
            <textarea id="editTextarea" placeholder="Take a note..." class="w-full flex-1 bg-transparent border-none outline-none text-gray-800 dark:text-gray-200 placeholder-gray-400 resize-none leading-relaxed note-content-text min-h-[300px]"></textarea>
            
            <!-- Trash Management Actions (Only shown in Trash view) -->
            <div id="trashTools" class="hidden mt-6 pt-6 border-t border-gray-200 dark:border-gray-800 flex flex-col sm:flex-row gap-3">
                <button onclick="restoreCurrentNote()" class="flex-1 py-3 px-4 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-100 font-medium rounded-xl transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span>Restore Note</span>
                </button>
                <button onclick="deleteNoteForever()" class="flex-1 py-3 px-4 bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 hover:bg-red-100 font-medium rounded-xl transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>Delete Permanently</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Core Application Logic -->
    <script>
        // State Management
        let notes = JSON.parse(localStorage.getItem('noteit_pro_v3') || '[]');
        let currentView = 'all';
        let currentEditingId = null;
        let isGridView = true;

        // DOM Elements
        const splash = document.getElementById('splash');
        const sideDrawer = document.getElementById('sideDrawer');
        const menuBackdrop = document.getElementById('menuBackdrop');
        const menuBtn = document.getElementById('menuBtn');
        const searchBtn = document.getElementById('searchBtn');
        const searchContainer = document.getElementById('searchContainer');
        const searchInput = document.getElementById('searchInput');
        const closeSearchBtn = document.getElementById('closeSearchBtn');
        const viewTitle = document.getElementById('viewTitle');
        const notesContainer = document.getElementById('notesContainer');
        const addBtn = document.getElementById('addBtn');
        const editorOverlay = document.getElementById('editorOverlay');
        const settingsModal = document.getElementById('settingsModal');
        const settingsModalContent = document.getElementById('settingsModalContent');

        // Initialize Splash Screen
        window.addEventListener('load', () => {
            // Load theme & settings from localStorage
            if (localStorage.getItem('ni_dark') === 'true') {
                document.documentElement.classList.add('dark');
                document.getElementById('darkToggle').checked = true;
            }
            const savedSize = localStorage.getItem('ni_size');
            if (savedSize) {
                document.getElementById('sizeSelect').value = savedSize;
                document.documentElement.style.setProperty('--note-font-size', savedSize);
            }

            renderNotes();

            setTimeout(() => {
                splash.classList.add('opacity-0', 'invisible');
            }, 800);
        });

        // Drawer Controls
        function toggleDrawer(open) {
            if (open) {
                sideDrawer.classList.remove('-translate-x-full');
                menuBackdrop.classList.remove('hidden');
                setTimeout(() => menuBackdrop.classList.remove('opacity-0'), 10);
            } else {
                sideDrawer.classList.add('-translate-x-full');
                menuBackdrop.classList.add('opacity-0');
                setTimeout(() => menuBackdrop.classList.add('hidden'), 300);
            }
        }

        menuBtn.onclick = () => toggleDrawer(true);
        menuBackdrop.onclick = () => toggleDrawer(false);

        // Switch Sidebar Views
        function switchView(view, el) {
            currentView = view;
            document.querySelectorAll('.drawer-item').forEach(item => {
                item.classList.remove('bg-amber-100/80', 'dark:bg-amber-900/30', 'text-amber-900', 'dark:text-amber-200', 'bg-gray-100', 'dark:bg-gray-700/50');
            });
            if (el) {
                el.classList.add('bg-amber-100/80', 'dark:bg-amber-900/30', 'text-amber-900', 'dark:text-amber-200');
            }
            viewTitle.innerText = view === 'all' ? 'All Notes' : (view === 'trash' ? 'Trash Bin' : view + ' Notes');
            toggleDrawer(false);
            renderNotes();
        }

        // Search Toggle
        searchBtn.onclick = () => {
            viewTitle.classList.add('hidden');
            searchBtn.classList.add('hidden');
            searchContainer.classList.remove('hidden');
            searchContainer.classList.add('flex');
            searchInput.focus();
        };

        closeSearchBtn.onclick = () => {
            searchInput.value = '';
            searchContainer.classList.add('hidden');
            searchContainer.classList.remove('flex');
            viewTitle.classList.remove('hidden');
            searchBtn.classList.remove('hidden');
            renderNotes();
        };

        searchInput.oninput = (e) => renderNotes(e.target.value.toLowerCase());

        // Settings Modal
        function openSettings() {
            toggleDrawer(false);
            settingsModal.classList.remove('hidden');
            setTimeout(() => {
                settingsModalContent.classList.remove('scale-95', 'opacity-0');
                settingsModalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeSettings() {
            settingsModalContent.classList.remove('scale-100', 'opacity-100');
            settingsModalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => settingsModal.classList.add('hidden'), 200);
        }

        function toggleDark() {
            const isDark = document.getElementById('darkToggle').checked;
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            localStorage.setItem('ni_dark', isDark);
        }

        function updateSize() {
            const size = document.getElementById('sizeSelect').value;
            document.documentElement.style.setProperty('--note-font-size', size);
            localStorage.setItem('ni_size', size);
        }

        // Layout Toggle (Grid vs List)
        function toggleLayout() {
            isGridView = !isGridView;
            const btnIcon = document.querySelector('#layoutToggleBtn i');
            btnIcon.className = isGridView ? 'fa-solid fa-border-all text-lg' : 'fa-solid fa-bars text-lg';
            renderNotes();
        }

        // Open Editor for New Note
        addBtn.onclick = () => {
            currentEditingId = null;
            document.getElementById('editTitleInput').value = '';
            document.getElementById('editTextarea').value = '';
            document.getElementById('editLabelSelect').value = currentView === 'all' || currentView === 'trash' ? 'Personal' : currentView;
            document.getElementById('trashTools').classList.add('hidden');
            editorOverlay.classList.remove('hidden');
            setTimeout(() => editorOverlay.classList.remove('translate-y-full'), 10);
            document.getElementById('editTitleInput').focus();
        };

        // Open Editor for Existing Note
        function openEditor(noteId) {
            const note = notes.find(n => n.id === noteId);
            if (!note) return;
            currentEditingId = noteId;
            document.getElementById('editTitleInput').value = note.title;
            document.getElementById('editTextarea').value = note.text;
            document.getElementById('editLabelSelect').value = note.label || 'Personal';
            
            if (note.trashed) {
                document.getElementById('trashTools').classList.remove('hidden');
            } else {
                document.getElementById('trashTools').classList.add('hidden');
            }

            editorOverlay.classList.remove('hidden');
            setTimeout(() => editorOverlay.classList.remove('translate-y-full'), 10);
        }

        function closeEditor() {
            editorOverlay.classList.add('translate-y-full');
            setTimeout(() => editorOverlay.classList.add('hidden'), 300);
        }

        // Save Note
        function saveNote() {
            const title = document.getElementById('editTitleInput').value.trim();
            const text = document.getElementById('editTextarea').value.trim();
            const label = document.getElementById('editLabelSelect').value;

            if (!title && !text) {
                closeEditor();
                return;
            }

            if (currentEditingId) {
                const index = notes.findIndex(n => n.id === currentEditingId);
                if (index !== -1) {
                    notes[index] = { ...notes[index], title, text, label, updatedAt: Date.now() };
                }
            } else {
                notes.unshift({
                    id: Date.now(),
                    title: title || 'Untitled Note',
                    text: text,
                    label: label,
                    trashed: false,
                    updatedAt: Date.now()
                });
            }

            syncStorage();
            closeEditor();
        }

        // Trash Operations
        function moveToTrash(e, noteId) {
            e.stopPropagation();
            const note = notes.find(n => n.id === noteId);
            if (note) {
                note.trashed = true;
                syncStorage();
            }
        }

        function restoreCurrentNote() {
            const note = notes.find(n => n.id === currentEditingId);
            if (note) {
                note.trashed = false;
                syncStorage();
                closeEditor();
            }
        }

        function deleteNoteForever() {
            notes = notes.filter(n => n.id !== currentEditingId);
            syncStorage();
            closeEditor();
        }

        function syncStorage() {
            localStorage.setItem('noteit_pro_v3', JSON.stringify(notes));
            renderNotes();
        }

        // Render Notes with Filtering and Sorting
        function renderNotes(searchQuery = '') {
            notesContainer.className = isGridView 
                ? "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4" 
                : "flex flex-col space-y-3 max-w-2xl mx-auto w-full";

            notesContainer.innerHTML = '';

            let filtered = notes.filter(n => {
                const matchesView = currentView === 'trash' ? n.trashed : (currentView === 'all' ? !n.trashed : !n.trashed && n.label === currentView);
                const matchesSearch = n.title.toLowerCase().includes(searchQuery) || n.text.toLowerCase().includes(searchQuery);
                return matchesView && matchesSearch;
            });

            if (filtered.length === 0) {
                notesContainer.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 text-center text-gray-400">
                        <div class="w-20 h-20 bg-blue-50 dark:bg-gray-800 rounded-full flex items-center justify-center mb-4 text-3xl text-blue-500">
                            <i class="fa-solid fa-pen-nib opacity-80"></i>
                        </div>
                        <h4 class="text-lg font-medium text-gray-700 dark:text-gray-300">No notes found</h4>
                        <p class="text-sm mt-1">Create a note using the floating button below.</p>
                    </div>
                `;
                return;
            }

            // Sorting
            const sortVal = document.getElementById('sortSelect').value;
            filtered.sort((a, b) => {
                if (sortVal === 'new') return b.id - a.id;
                if (sortVal === 'old') return a.id - b.id;
                if (sortVal === 'az') return a.title.localeCompare(b.title);
            });

            filtered.forEach(note => {
                const card = document.createElement('div');
                card.className = "note-card bg-white dark:bg-[#2b2d31] border border-gray-200/80 dark:border-gray-700/60 rounded-2xl p-5 flex flex-col justify-between cursor-pointer relative group overflow-hidden shadow-sm";
                card.onclick = () => openEditor(note.id);

                const badgeColor = note.label === 'Work' ? 'bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300' :
                                   note.label === 'Ideas' ? 'bg-yellow-100 dark:bg-yellow-950/60 text-yellow-700 dark:text-yellow-300' :
                                   'bg-blue-100 dark:bg-blue-950/60 text-blue-700 dark:text-blue-300';

                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between mb-2">
                            <h3 class="font-semibold text-gray-900 dark:text-gray-100 text-base truncate flex-1 pr-2">${escapeHTML(note.title)}</h3>
                            <span class="text-[10px] font-medium px-2.5 py-1 rounded-full ${badgeColor}">${note.label || 'Personal'}</span>
                        </div>
                        <p class="text-gray-600 dark:text-gray-300 note-content-text line-clamp-4 whitespace-pre-wrap mb-4">${escapeHTML(note.text || 'No additional text')}</p>
                    </div>
                    <div class="flex items-center justify-between pt-3 border-t border-gray-100 dark:border-gray-700/50 text-xs text-gray-400">
                        <span>${formatDate(note.id)}</span>
                        ${currentView === 'trash' ? 
                            `<span class="text-red-500 font-medium">In Trash</span>` :
                            `<button onclick="moveToTrash(event, ${note.id})" title="Move to Trash" class="opacity-0 group-hover:opacity-100 transition p-1.5 hover:text-red-500 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
                                <i class="fa-regular fa-trash-can"></i>
                             </button>`
                        }
                    </div>
                `;
                notesContainer.appendChild(card);
            });
        }

        // Utility: HTML escape to prevent XSS
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Utility: Format Timestamp
        function formatDate(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        }
    </script>
</body>
</html>
